plugins {
    id "com.android.application"
}

android {
    namespace "com.example.hardenedkiosk"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.hardenedkiosk"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0-secure-demo"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            debuggable false
        }
    }
}
